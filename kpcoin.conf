# KPCoin Node Configuration File
# Place this at ~/.kpcoin/kpcoin.conf

# ============================================
# Network
# ============================================
# Run on mainnet
# testnet=0

# Listen for incoming connections
listen=1

# Maximum peer connections
maxconnections=64

# P2P port (default: 12130)
port=12130

# ============================================
# RPC Server
# ============================================
# Enable RPC server
server=1

# RPC port (default: 12131)
rpcport=12131

# RPC credentials (CHANGE THESE!)
rpcuser=kpcoinrpc
rpcpassword=CHANGE_THIS_TO_A_STRONG_PASSWORD

# Allow RPC from localhost only
rpcallowip=127.0.0.1

# ============================================
# Mining
# ============================================
# Enable mining (set to 1 to mine)
# gen=1

# Number of mining threads (0 = all cores)
# genproclimit=0

# ============================================
# Logging
# ============================================
# Enable debug logging (useful during initial setup)
debug=net
debug=rpc
# debug=mempool
# debug=validation

# Log to console as well as file
printtoconsole=1

# ============================================
# Performance
# ============================================
# Database cache size in MB (default: 450)
dbcache=512

# Maintain a full transaction index
txindex=1

# ============================================
# Seed Nodes
# ============================================
# Add seed nodes here when you have them running
# addnode=seed1.kpcoin.network:12130
# addnode=seed2.kpcoin.network:12130
